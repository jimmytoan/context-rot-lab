[project]
name = "context-rot-lab"
version = "0.1.0"
description = "Does the agent still remember the rule at turn 150? Context-management strategies compared on one long simulated shift."
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic>=1.0",
  "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
